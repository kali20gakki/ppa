name: Build PPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake python3 python3-pip ccache autoconf gperf libtool libssl-dev pigz

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel

    - name: Build PPA
      run: |
        chmod +x build_npu_profiler.sh
        ./build_npu_profiler.sh

    - name: Upload Wheel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ppa-wheel
        path: dist/*.whl
